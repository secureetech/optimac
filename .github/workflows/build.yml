name: Compiler OptiMac

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer le certificat Apple (Developer ID)
        id: cert
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then echo "Pas de certificat configuré : signature ad hoc"; exit 0; fi
          KC="$RUNNER_TEMP/signature.keychain-db"; KP="$(uuidgen)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychain -d user -s "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          [ -n "$ID" ] || { echo "Certificat Developer ID introuvable dans le trousseau"; exit 1; }
          echo "identity=$ID" >> "$GITHUB_OUTPUT"

      - name: Fabriquer OptiMac.app et le .dmg
        id: build
        env:
          VERSION: "1.2.0"
          BUILD: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          APPLE_ID: contact@secureetech.com
          APPLE_TEAM_ID: HY2LAK3454
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/build-app.sh

      - name: Captures d'écran de l'interface
        if: success()
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots
          ./dist/OptiMac.app/Contents/MacOS/OptiMac --tour /tmp/shots &
          PID=$!
          for i in $(seq 1 260); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          ls -la /tmp/shots
          git config user.name "OptiMac CI"
          git config user.email "ci@secureetech.com"
          git fetch origin screenshots 2>/dev/null || true
          git checkout --orphan screenshots
          git rm -rf . >/dev/null
          cp /tmp/shots/*.png .
          echo "${{ github.sha }}" > commit.txt
          git add *.png commit.txt
          git commit -m "Captures ${{ github.run_number }}"
          git push -f origin screenshots
          git checkout -f main

      - name: Publier le journal de compilation (en cas d'erreur)
        if: failure()
        run: |
          git config user.name "OptiMac CI"
          git config user.email "ci@secureetech.com"
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log 2>/dev/null || echo "pas de build.log" > /tmp/log/build.log
          grep -E "error:" /tmp/log/build.log | sort -u | head -80 > /tmp/log/errors.txt || true
          git checkout --orphan build-log
          git rm -rf . >/dev/null
          cp /tmp/log/* .
          echo "${{ github.sha }}" > commit.txt
          git add build.log errors.txt commit.txt
          git commit -m "Journal de compilation ${{ github.run_number }}"
          git push -f origin build-log

      - name: Publier le .dmg
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: "1.2.0"
        run: |
          # On remplace les fichiers sans supprimer la publication : les liens restent valables en permanence.
          TITLE="OptiMac $VERSION (build ${{ github.run_number }})"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/OptiMac.dmg dist/OptiMac-1.0.0.dmg --clobber
            gh release edit latest --title "$TITLE"
          else
            gh release create latest dist/OptiMac.dmg dist/OptiMac-1.0.0.dmg --title "$TITLE" \
              --notes "OptiMac pour macOS 11 Big Sur et plus récent (Intel et Apple Silicon)."
          fi
