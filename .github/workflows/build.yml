name: Compiler OptiMac

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Fabriquer OptiMac.app et le .dmg
        id: build
        env:
          VERSION: "1.0.0"
          BUILD: ${{ github.run_number }}
        run: ./scripts/build-app.sh

      - name: Captures d'écran de l'interface
        if: success()
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots
          ./dist/OptiMac.app/Contents/MacOS/OptiMac --tour /tmp/shots &
          PID=$!
          for i in $(seq 1 150); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          ls -la /tmp/shots
          git config user.name "OptiMac CI"
          git config user.email "ci@secureetech.com"
          git fetch origin screenshots 2>/dev/null || true
          git checkout --orphan screenshots
          git rm -rf . >/dev/null
          cp /tmp/shots/*.png .
          echo "${{ github.sha }}" > commit.txt
          git add *.png commit.txt
          git commit -m "Captures ${{ github.run_number }}"
          git push -f origin screenshots
          git checkout -f main

      - name: Publier le journal de compilation (en cas d'erreur)
        if: failure()
        run: |
          git config user.name "OptiMac CI"
          git config user.email "ci@secureetech.com"
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log 2>/dev/null || echo "pas de build.log" > /tmp/log/build.log
          grep -E "error:" /tmp/log/build.log | sort -u | head -80 > /tmp/log/errors.txt || true
          git checkout --orphan build-log
          git rm -rf . >/dev/null
          cp /tmp/log/* .
          echo "${{ github.sha }}" > commit.txt
          git add build.log errors.txt commit.txt
          git commit -m "Journal de compilation ${{ github.run_number }}"
          git push -f origin build-log

      - name: Publier le .dmg
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On remplace le fichier sans supprimer la publication : le lien reste valable en permanence.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/OptiMac-1.0.0.dmg --clobber
            gh release edit latest --title "OptiMac 1.0.0 (build ${{ github.run_number }})"
          else
            gh release create latest dist/OptiMac-1.0.0.dmg --title "OptiMac 1.0.0 (build ${{ github.run_number }})" \
              --notes "OptiMac pour macOS 11 Big Sur et plus récent (Intel et Apple Silicon)."
          fi
